apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: todo-cache-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-dep
spec:
  # The image cache is a ReadWriteOnce volume: a rolling update would try to mount it in two
  # pods at the same time, so the old pod must go away first.
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: image-cache
          persistentVolumeClaim:
            claimName: todo-cache-pvc
      containers:
        - name: todo-app
          image: todo-app:3.5
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: todo-app-config
          env:
            - name: PORT
              value: "3000"
            - name: CACHE_DIR
              value: /usr/src/app/cache
          volumeMounts:
            - name: image-cache
              mountPath: /usr/src/app/cache
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: todo-app-svc
spec:
  type: NodePort
  selector:
    app: todo-app
  ports:
    - protocol: TCP
      port: 2345
      targetPort: 3000
