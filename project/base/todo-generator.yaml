apiVersion: batch/v1
kind: CronJob
metadata:
  name: todo-generator
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: todo-generator
        spec:
          restartPolicy: Never
          containers:
            - name: todo-generator
              image: todo-generator:3.5
              env:
                - name: TODO_BACKEND_URL
                  value: http://todo-backend-svc:2345
                - name: WIKIPEDIA_URL
                  value: https://en.wikipedia.org/api/rest_v1/page/random/summary
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
