apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-app-config
data:
  PUBLIC_PATH: ""
  IMAGE_URL: https://picsum.photos/1200
  IMAGE_CACHE_MINUTES: "10"
  TODO_BACKEND_URL: http://todo-backend-svc:2345
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-backend-config
data:
  MAX_TODO_LENGTH: "140"
  NATS_URL: nats://my-nats.nats.svc.cluster.local:4222
  NATS_SUBJECT: todos.events
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-postgres-config
data:
  POSTGRES_DB: todos
  POSTGRES_USER: todos
---
apiVersion: v1
kind: Secret
metadata:
  name: todo-postgres-secret
type: Opaque
stringData:
  POSTGRES_PASSWORD: todos
