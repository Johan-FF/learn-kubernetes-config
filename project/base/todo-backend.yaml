apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
    spec:
      containers:
        - name: todo-backend
          image: todo-backend:3.5
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: todo-backend-config
          env:
            - name: PORT
              value: "3000"
            - name: PG_HOST
              value: todo-postgres-svc
            - name: PG_PORT
              value: "5432"
            - name: PG_USER
              valueFrom:
                configMapKeyRef:
                  name: todo-postgres-config
                  key: POSTGRES_USER
            - name: PG_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: todo-postgres-config
                  key: POSTGRES_DB
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todo-postgres-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: todo-backend-svc
spec:
  type: ClusterIP
  selector:
    app: todo-backend
  ports:
    - protocol: TCP
      port: 2345
      targetPort: 3000
