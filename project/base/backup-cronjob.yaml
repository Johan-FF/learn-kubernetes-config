apiVersion: batch/v1
kind: CronJob
metadata:
  name: todo-backup
spec:
  # Once per day, a dump of the todo database is uploaded to Google Cloud Storage.
  schedule: "15 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: todo-backup
        spec:
          serviceAccountName: backup-sa
          restartPolicy: Never
          containers:
            - name: backup
              image: todo-backup:3.10
              env:
                - name: PGHOST
                  value: todo-postgres-svc
                - name: PGUSER
                  valueFrom:
                    configMapKeyRef:
                      name: todo-postgres-config
                      key: POSTGRES_USER
                - name: PGDATABASE
                  valueFrom:
                    configMapKeyRef:
                      name: todo-postgres-config
                      key: POSTGRES_DB
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: todo-postgres-secret
                      key: POSTGRES_PASSWORD
                - name: BACKUP_BUCKET
                  value: project-74b28d99-70ba-47ca-9bc-dwk-backups
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  memory: 256Mi
