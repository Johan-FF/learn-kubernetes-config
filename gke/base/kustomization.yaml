apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared GKE workload for the "Log output" and "Ping-pong" exercises. Each exercise directory
# on top of this one adds the resource that the exercise is about (Service type, Ingress,
# Gateway API route) and overrides the image tag.
resources:
  - namespace.yaml
  - postgres.yaml
  - ping-pong.yaml
  - log-output.yaml

images:
  - name: ping-pong
    newName: europe-north1-docker.pkg.dev/project-74b28d99-70ba-47ca-9bc/dwk/ping-pong
    newTag: "3.1"
  - name: log-output-writer
    newName: europe-north1-docker.pkg.dev/project-74b28d99-70ba-47ca-9bc/dwk/log-output-writer
    newTag: "3.1"
  - name: log-output-reader
    newName: europe-north1-docker.pkg.dev/project-74b28d99-70ba-47ca-9bc/dwk/log-output-reader
    newTag: "3.1"
