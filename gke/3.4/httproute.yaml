apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dwk-route
  namespace: dwk-gke
spec:
  parentRefs:
    - name: dwk-gateway
  rules:
    # The application is served from / and the Gateway strips the /pingpong prefix, so the
    # cluster URL structure no longer leaks into the application itself.
    - matches:
        - path:
            type: PathPrefix
            value: /pingpong
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: ping-pong-svc
          port: 2345
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: log-output-svc
          port: 2345
