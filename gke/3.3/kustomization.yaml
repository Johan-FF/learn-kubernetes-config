apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Exercise 3.3: the Ingress is replaced by the Gateway API. GKE still needs NodePort Services
# as backends for the Gateway.
resources:
  - ../base
  - gateway.yaml
  - httproute.yaml

patches:
  - target:
      kind: Service
      name: ping-pong-svc
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
  - target:
      kind: Service
      name: log-output-svc
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
