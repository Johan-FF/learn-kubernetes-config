apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Exercise 3.1: "Ping-pong" on GKE, exposed through a LoadBalancer Service.
resources:
  - ../base

patches:
  - target:
      kind: Service
      name: ping-pong-svc
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer
