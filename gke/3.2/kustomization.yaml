apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Exercise 3.2: both applications behind a GKE Ingress. The Ingress controller needs NodePort
# Services as backends, and it health checks the / path of every backend.
resources:
  - ../base
  - ingress.yaml

patches:
  - target:
      kind: Service
      name: ping-pong-svc
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
  - target:
      kind: Service
      name: log-output-svc
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
