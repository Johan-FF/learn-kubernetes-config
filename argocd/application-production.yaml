apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: project-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Johan-FF/learn-kubernetes-config.git
    # Production follows the tags: bumping this value to a newer release tag is the deploy.
    targetRevision: "4.10"
    path: project/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
